name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - 'rambdaA/**'
      - 'rambdaB/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write   # OIDC 토큰 발급 필수
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rambdaA: ${{ steps.filter.outputs.rambdaA }}
      rambdaB: ${{ steps.filter.outputs.rambdaB }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rambdaA:
              - 'rambdaA/**'
            rambdaB:
              - 'rambdaB/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        # pandas 필수 — rambdaA(fdr.py/yf.py)와 backtest/strategies가 의존한다.
        # 2026-08-03 fix24/25/26이 pandas 의존 테스트를 추가했는데 이 줄은 boto3까지만
        # 늘어난 상태였다. 그 결과 test 잡이 ImportError로 실패해왔고, deploy 잡은
        # `needs: test`라 **그 이후 rambdaA/B 변경이 배포되지 않았을 수 있다.**
        # (2026-08-24 CI 환경 재현으로 확인: 이 줄에 pandas가 없으면 5개 모듈 ImportError)
        run: pip install urllib3 boto3 pandas
      - name: 실행경로 단위테스트 (통과해야 배포)
        run: python -m unittest discover -s tests -v

  deploy-rambda-a:
    needs: [changes, test]
    if: needs.changes.outputs.rambdaA == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Zip rambdaA
        run: cd rambdaA && zip -r ../rambdaA.zip . -x '*.venv*'
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME_A }} \
            --zip-file fileb://rambdaA.zip

  deploy-rambda-b:
    needs: [changes, test]
    if: needs.changes.outputs.rambdaB == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Zip rambdaB
        run: cd rambdaB && zip -r ../rambdaB.zip . -x '*.venv*'
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME_B }} \
            --zip-file fileb://rambdaB.zip
